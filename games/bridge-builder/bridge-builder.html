<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101826">
<title>Bridge Builder</title>
<style>
  :root {
    --bg: #0d1420;
    --panel: #131d2e;
    --panel2: #1b2940;
    --line: #2a3c5a;
    --line2: #3d5784;
    --text: #e9eff8;
    --muted: #8fa3bf;
    --accent: #ffb547;
    --good: #3ecf8e;
    --bad: #ff5d5d;
    --shadow: 0 12px 44px rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden;
    -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid #0b111b; }
  .brand { font-size: 15px; font-weight: 800; letter-spacing: .6px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .lvtitle { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden; }
  .lvtitle b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvtitle small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 10px; cursor: pointer; touch-action: manipulation; }
  button:hover { border-color: var(--line2); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.active { background: #2b4470; border-color: var(--accent); }
  button.ghost { background: transparent; }
  #budget { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 110px; }
  #budgetTxt { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  #budget .bar { width: 100%; height: 5px; border-radius: 3px; background: #0a101a; overflow: hidden; }
  #budget .bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .2s, background .2s; }
  #budget.over #budgetTxt { color: var(--bad); font-weight: 700; }
  #stage { position: relative; flex: 1; min-height: 0; background: #7fb2e0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #toolbar { display: flex; gap: 5px; padding: 6px; background: var(--panel); flex-wrap: wrap; justify-content: center; border-top: 1px solid #0b111b; }
  #toolbar button { min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 7px; font-size: 13px; line-height: 1.1; }
  #toolbar small { color: var(--muted); font-size: 10px; }
  .swatch { width: 26px; height: 6px; border-radius: 3px; }
  #testBtn { background: #1d7a51; border-color: #2fae76; font-weight: 800; min-width: 84px; font-size: 14px; }
  #testBtn.stop { background: #8a2c2c; border-color: #c24848; }
  .sep { width: 1px; background: var(--line); margin: 0 2px; }
  #zoomCtl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 5px; }
  #zoomCtl button { width: 36px; height: 36px; padding: 0; font-size: 18px; background: rgba(19, 29, 46, .82); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center;
    background: rgba(5, 10, 20, .58); padding: 12px; overflow: auto; }
  #overlay[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
    max-width: 380px; width: 100%; text-align: center; box-shadow: var(--shadow); margin: auto; }
  .card.wide { max-width: 860px; }
  .card.brief { max-width: 460px; padding: 0; overflow: hidden; text-align: left; }
  .card h2 { margin: 0 0 6px; font-size: 21px; }
  .card p { margin: 6px 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .card .stars { font-size: 30px; letter-spacing: 4px; margin: 6px 0; color: var(--accent); }
  .card .stars i { font-style: normal; opacity: .22; }
  .card .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .card .body { padding: 14px 18px 16px; }
  .photo { position: relative; aspect-ratio: 16 / 8; background: linear-gradient(135deg, #36507a, #1c2a42); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 8px; font-size: 12px; color: #e9eff8;
    background: linear-gradient(transparent, rgba(0, 0, 0, .72)); }
  .photo .cap a { color: #bcd2f0; }
  .photo .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb4d4; font-size: 13px; padding: 20px; text-align: center; }
  .fact { color: #c9d6ea !important; }
  .tip { background: #1a2a42; border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 6px; color: #dfe8f5 !important; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: #1b2940; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 9px; color: #d5e0f0; }
  .vehicles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .veh { display: flex; align-items: center; gap: 8px; background: #1b2940; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px 4px 4px; font-size: 12px; color: #d5e0f0; }
  .veh .vimg { width: 64px; height: 40px; border-radius: 6px; overflow: hidden; background: #26385a; flex: none; }
  .veh .vimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .veh b { display: block; font-size: 12px; color: var(--text); }
  button.veh { text-align: left; }
  button.veh.active { border-color: var(--accent); background: #2b4470; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; text-align: left; }
  .lvcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; border-radius: 12px; text-align: left; }
  .lvcard.cur { border-color: var(--accent); }
  .lvcard .thumb { aspect-ratio: 16 / 9; background: var(--sw, #2a3c5a); position: relative; overflow: hidden; }
  .lvcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lvcard .num { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, .6); border-radius: 6px; padding: 1px 7px; font-weight: 800; font-size: 13px; }
  .lvcard .meta { padding: 7px 9px 8px; display: flex; flex-direction: column; gap: 2px; }
  .lvcard .meta b { font-size: 14px; }
  .lvcard .meta span { font-size: 11px; color: var(--muted); }
  .lvcard .meta .stars { color: var(--accent); font-size: 14px; letter-spacing: 2px; }
  .lvcard .meta .stars i { font-style: normal; opacity: .22; }
  .help { text-align: left; font-size: 14px; color: #c9d6ea; line-height: 1.55; }
  .help b { color: var(--text); }
  .credits { text-align: left; font-size: 12px; color: #b9c8de; max-height: 55vh; overflow: auto; line-height: 1.5; }
  .credits a { color: #9cc3ff; }
  .credits li { margin-bottom: 4px; }
  #toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(20, 32, 54, .94); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 10px; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: calc(100% - 100px); text-align: center; }
  #toast.show { opacity: 1; }
  #hud { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #f2f6fb; pointer-events: none;
    text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, .6); }
  @media (max-width: 640px) {
    .brand, #menuBtn .lbl { display: none; }
    header { gap: 6px; padding: 5px 8px; }
    header button { padding: 6px 9px; }
    .lvtitle { flex-direction: column; align-items: flex-start; gap: 0; }
    .lvtitle b { font-size: 13px; max-width: 100%; }
    .lvtitle small { font-size: 11px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #toolbar button { min-width: 46px; padding: 4px 5px; font-size: 12px; }
    #toolbar small { font-size: 9px; }
    #budget { min-width: 88px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (max-height: 520px) {
    .brand { display: none; }
    header { padding: 3px 8px; }
    header button { padding: 5px 9px; }
    #toolbar { gap: 4px; padding: 4px; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
    #toolbar button { min-width: 44px; padding: 4px 6px; flex: none; }
    #toolbar small { display: none; }
    #testBtn { min-width: 70px; }
    #zoomCtl button { width: 32px; height: 32px; }
    .photo { aspect-ratio: auto; height: 34vh; }
    .card .body { padding: 10px 14px 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">BRIDGE <span>BUILDER</span></div>
    <button id="menuBtn" title="Choose level">☰<span class="lbl"> Levels</span></button>
    <div class="lvtitle"><b id="lvName">Level</b><small id="lvInfo"></small></div>
    <div id="budget"><span id="budgetTxt">$0</span><div class="bar"><i id="budgetBar"></i></div></div>
    <button id="soundBtn" title="Sound on/off">🔊</button>
    <button id="helpBtn" title="How to play">?</button>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="zoomCtl">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomFit" title="Fit level (F)">⤢</button>
    </div>
    <div id="toast"></div>
    <div id="overlay" hidden><div class="card" id="card"></div></div>
  </div>
  <div id="toolbar">
    <button data-tool="road" title="Road deck (1)"><div class="swatch" style="background:#45464d;border-top:2px solid #f5d142"></div>Road<small>$200/m</small></button>
    <button data-tool="wood" title="Timber (2)"><div class="swatch" style="background:#b8864e"></div>Wood<small>$100/m</small></button>
    <button data-tool="steel" title="Steel girder (3)"><div class="swatch" style="background:#c4513a"></div>Steel<small>$300/m</small></button>
    <button data-tool="cable" title="Steel cable, pulls only (4)"><div class="swatch" style="background:#26272b;height:3px;margin:1px 0 2px"></div>Cable<small>$80/m</small></button>
    <div class="sep"></div>
    <button data-tool="erase" title="Erase (E)">✖<small>Erase</small></button>
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶<small>Undo</small></button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">↷<small>Redo</small></button>
    <button id="mirrorBtn" title="Mirror building around the centre (M)">⇋<small>Mirror</small></button>
    <button id="clearBtn" title="Clear bridge">🗑<small>Clear</small></button>
    <button id="stressBtn" title="Show stress colours (S)">🌡<small>Stress</small></button>
    <button id="speedBtn" title="Simulation speed">⏱<small>1×</small></button>
    <button id="testBtn" title="Run the test (Space)">▶ TEST</button>
  </div>
</div>

<script>
// PHYSICS-START
// ===================== PHYSICS (no DOM) =====================
// Units: meters, kilograms, seconds, newtons. y points UP.
// Pin-jointed truss solved with XPBD (many small substeps, one iteration each).
const GRAV = 9.81;

const MATERIALS = {
  road:  { key: 'road',  name: 'Road',  cost: 200, density: 120, EA: 2.0e7, strength: 60000, maxLen: 4.5, tensionOnly: false, color: '#45464d', width: 0.36 },
  wood:  { key: 'wood',  name: 'Wood',  cost: 100, density: 30,  EA: 1.0e7, strength: 40000, maxLen: 4.5, tensionOnly: false, color: '#b8864e', width: 0.20 },
  steel: { key: 'steel', name: 'Steel', cost: 300, density: 60,  EA: 3.0e7, strength: 95000, maxLen: 4.5, tensionOnly: false, color: '#c4513a', width: 0.18 },
  cable: { key: 'cable', name: 'Cable', cost: 80,  density: 10,  EA: 1.5e7, strength: 160000, maxLen: 16,  tensionOnly: true,  color: '#26272b', width: 0.07 },
};
const MATERIAL_KEYS = Object.keys(MATERIALS);

// Long members buckle: compression capacity drops with length squared (Euler buckling, simplified).
function compStrength(mat, L) {
  const M = MATERIALS[mat];
  if (M.tensionOnly) return 0;
  const k = Math.min(1, (3 / L) * (3 / L));
  return M.strength * k;
}

// Axles: [distance ahead of the rear axle (m), share of the weight]. rear = rear overhang behind the rear axle.
const VEHICLES = {
  car:   { key: 'car',   name: 'Hatchback',    mass: 1200,  length: 4.25, height: 1.48, rear: 0.78, axles: [[0, 0.42], [2.62, 0.58]], wheelR: 0.32, speed: 4.2, accel: 2.2, maxGrade: 0.35, color: '#e9edf1' },
  van:   { key: 'van',   name: 'Delivery van', mass: 2200,  length: 5.95, height: 2.55, rear: 1.10, axles: [[0, 0.50], [3.66, 0.50]], wheelR: 0.36, speed: 3.8, accel: 1.6, maxGrade: 0.30, color: '#f3f4f2' },
  truck: { key: 'truck', name: 'Box truck',    mass: 4000,  length: 7.40, height: 3.30, rear: 1.90, axles: [[0, 0.62], [4.20, 0.38]], wheelR: 0.45, speed: 3.4, accel: 1.2, maxGrade: 0.26, color: '#f1f1ec' },
  dump:  { key: 'dump',  name: 'Dump truck',   mass: 7000,  length: 8.20, height: 3.15, rear: 1.30, axles: [[0, 0.35], [1.35, 0.35], [5.20, 0.30]], wheelR: 0.52, speed: 3.0, accel: 0.9, maxGrade: 0.24, color: '#e9a23b' },
  bus:   { key: 'bus',   name: 'School bus',   mass: 8000, length: 11.6, height: 3.20, rear: 3.00, axles: [[0, 0.64], [6.10, 0.36]], wheelR: 0.50, speed: 3.2, accel: 0.9, maxGrade: 0.22, color: '#f6b400' },
  semi:  { key: 'semi',  name: 'Semi truck',   mass: 12000, length: 16.4, height: 4.00, rear: 1.20, axles: [[0, 0.2], [1.3, 0.2], [9.6, 0.2], [10.9, 0.2], [14.6, 0.2]], wheelR: 0.50, speed: 3.0, accel: 0.7, maxGrade: 0.20, color: '#2f7d4f' },
};

// ---------- levels ----------
// Banks: left bank is x<=0, y<=leftY. Right bank is x>=gap, y<=rightY. Riverbed at y=floor, water surface at y=water.
// pillars stand on the riverbed; towers stand on `base`; noBuild rectangles are shipping lanes that must stay clear.
const LEVELS = [
  { id: 'first', name: 'First Crossing', gap: 8, floor: -6, top: 4, budget: 6000, star2: 4800, star3: 3600, vehicles: ['car'],
    anchors: [[0, 0], [8, 0], [0, -2], [8, -2]], theme: 'meadow', photo: 'hildreth',
    tip: 'Triangles are strong. Lay road across, then brace it with wood triangles underneath.' },
  { id: 'wider', name: 'Wider Gap', gap: 12, floor: -7, top: 4, budget: 8000, star2: 6500, star3: 5300, vehicles: ['van'],
    anchors: [[0, 0], [12, 0], [0, -3], [12, -3]], theme: 'overcast', photo: 'quebec',
    tip: 'A deeper truss handles more load. Long beams buckle when squeezed: keep compression members short.' },
  { id: 'pillar', name: 'Middle Pillar', gap: 20, floor: -8, top: 4, budget: 19500, star2: 16500, star3: 14000, vehicles: ['truck'],
    anchors: [[0, 0], [20, 0], [0, -2], [20, -2], [10, -4]], pillars: [{ x0: 9, x1: 11, top: -4 }], theme: 'coast', photo: 'causeway',
    tip: 'Use the pier anchor to split the span in two. Steel is pricey but strong.' },
  { id: 'uphill', name: 'Uphill Climb', gap: 14, floor: -8, top: 7, leftY: 0, rightY: 3, budget: 9500, star2: 8000, star3: 6700, vehicles: ['van'],
    anchors: [[0, 0], [14, 3], [0, -3], [14, 0]], theme: 'alpine', photo: 'landwasser',
    tip: 'The far bank is 3 m higher. Keep every road slope gentle: a loaded van stalls on grades over 30%.' },
  { id: 'suspension', name: 'Suspension', gap: 24, floor: -8, top: 10, budget: 19000, star2: 16000, star3: 13500, vehicles: ['truck'],
    anchors: [[0, 0], [24, 0], [-1, 8], [25, 8]], towers: [{ x0: -2, x1: -1, base: 0, top: 8 }, { x0: 25, x1: 26, base: 0, top: 8 }], theme: 'sunset', photo: 'goldengate',
    tip: 'No anchors below! Hang the road from the towers with cables (cables only pull).' },
  { id: 'gorge', name: 'Deep Gorge', gap: 22, floor: -16, top: 4, water: -14.6, budget: 29000, star2: 24500, star3: 21000, vehicles: ['truck'],
    anchors: [[0, 0], [22, 0], [0, -6], [22, -6], [0, -10], [22, -10]], materials: ['road', 'wood', 'steel'], theme: 'forest', photo: 'newriver',
    tip: 'The river is far below. Spring an arch from the cliff faces and prop the road on it. Arches push, they never pull.' },
  { id: 'convoy', name: 'Convoy', gap: 18, floor: -8, top: 4, budget: 28500, star2: 24500, star3: 20500, vehicles: ['truck', 'truck'], convoyGap: 2.5,
    anchors: [[0, 0], [18, 0], [0, -2], [18, -2], [0, -4], [18, -4]], theme: 'city', photo: 'brooklyn',
    tip: 'Two trucks nose-to-tail: nearly 9 tonnes on the span at once. Design for the worst moment, not the average.' },
  { id: 'harbour', name: 'Harbour Arch', gap: 26, floor: -8, top: 10, budget: 41000, star2: 35000, star3: 29500, vehicles: ['truck'],
    anchors: [[0, 0], [26, 0], [0, -3], [26, -3]], noBuild: [{ x0: 3, x1: 23, y0: -8, y1: -1, ship: true }], theme: 'harbour', photo: 'sydney',
    tip: 'Ships need the lane under the road kept clear. Put the structure above the deck: a through-arch or truss.' },
  { id: 'stayed', name: 'Cable-Stayed', gap: 30, floor: -8, top: 14, budget: 23000, star2: 19500, star3: 16500, vehicles: ['truck'],
    anchors: [[0, 0], [30, 0], [0, -2], [30, -2], [15, -2], [15, 12]], pillars: [{ x0: 14, x1: 16, top: -2 }], towers: [{ x0: 14.6, x1: 15.4, base: -2, top: 12, behind: true }],
    noBuild: [{ x0: 2, x1: 13, y0: -8, y1: -3, ship: true }, { x0: 17, x1: 28, y0: -8, y1: -3, ship: true }], theme: 'valley', photo: 'millau',
    tip: 'One tall pylon. Fan cables straight from its top to the deck, like the Millau Viaduct.' },
  { id: 'storm', name: 'Storm Warning', gap: 24, floor: -8, top: 10, budget: 28500, star2: 24000, star3: 20500, vehicles: ['truck'],
    anchors: [[0, 0], [24, 0], [-1, 8], [25, 8], [0, -2], [24, -2]], towers: [{ x0: -2, x1: -1, base: 0, top: 8 }, { x0: 25, x1: 26, base: 0, top: 8 }],
    wind: { amp: 3500, period: 2.2, wavelength: 24, ramp: 3 }, theme: 'storm', photo: 'tacoma',
    tip: 'Gale-force gusts heave the deck up and down. A floppy deck will gallop itself apart: stiffen it with a truss.' },
  { id: 'cantilever', name: 'Cantilever', gap: 32, floor: -9, top: 8, budget: 55000, star2: 48000, star3: 41000, vehicles: ['dump'],
    anchors: [[0, 0], [32, 0], [0, -3], [32, -3], [10, -5], [22, -5]], pillars: [{ x0: 9, x1: 11, top: -5 }, { x0: 21, x1: 23, top: -5 }], theme: 'firth', photo: 'forth',
    tip: 'Balance arms out from each pier and link them in the middle, like the Forth Bridge. 8 t on three axles.' },
  { id: 'clifton', name: 'Gorge Suspension', gap: 28, floor: -18, top: 10, water: -16.4, budget: 48500, star2: 42500, star3: 36000, vehicles: ['bus'],
    anchors: [[0, 0], [28, 0], [-1, 8], [29, 8]], towers: [{ x0: -2, x1: -1, base: 0, top: 8 }, { x0: 29, x1: 30, base: 0, top: 8 }], theme: 'gorge', photo: 'clifton',
    tip: 'A long drop and nothing below. Hang a stiff deck from the towers: a 10 t bus puts 6 t on its back axle.' },
  { id: 'tower', name: 'Tower Bridge', gap: 30, floor: -8, top: 10, budget: 32500, star2: 28500, star3: 24000, vehicles: ['van', 'truck'], convoyGap: 3,
    anchors: [[0, 0], [30, 0], [0, -2], [30, -2], [9, -2], [21, -2], [9, 8], [21, 8]],
    pillars: [{ x0: 8, x1: 10, top: -2 }, { x0: 20, x1: 22, top: -2 }], towers: [{ x0: 8.5, x1: 9.5, base: -2, top: 8, behind: true }, { x0: 20.5, x1: 21.5, base: -2, top: 8, behind: true }],
    noBuild: [{ x0: 10, x1: 20, y0: -8, y1: -1, ship: true }], theme: 'dusk', photo: 'towerbridge',
    tip: 'Keep the central lane clear for tall ships. Hang or truss the middle span from the two towers.' },
  { id: 'strait', name: 'Strait Crossing', gap: 36, floor: -9, top: 13, budget: 50000, star2: 44000, star3: 37500, vehicles: ['semi'],
    anchors: [[0, 0], [36, 0], [0, -3], [36, -3], [8, -2], [28, -2], [8, 12], [28, 12]],
    pillars: [{ x0: 7, x1: 9, top: -2 }, { x0: 27, x1: 29, top: -2 }],
    towers: [{ x0: 7.6, x1: 8.4, base: -2, top: 12, behind: true }, { x0: 27.6, x1: 28.4, base: -2, top: 12, behind: true }],
    noBuild: [{ x0: 10, x1: 26, y0: -9, y1: -3, ship: true }], theme: 'sea', photo: 'akashi',
    tip: 'Towers stand in the strait, like the Akashi Kaikyo Bridge. A 12 t semi on five axles, and ships pass underneath.' },
  { id: 'rush', name: 'Rush Hour', gap: 34, floor: -9, top: 10, budget: 64500, star2: 56500, star3: 48000, vehicles: ['car', 'van', 'bus', 'dump'], convoyGap: 2.5,
    anchors: [[0, 0], [34, 0], [0, -3], [34, -3], [17, -4], [-1, 8], [35, 8]], pillars: [{ x0: 16, x1: 18, top: -4 }],
    towers: [{ x0: -2, x1: -1, base: 0, top: 8 }, { x0: 35, x1: 36, base: 0, top: 8 }], theme: 'evening', photo: 'oresund',
    tip: 'Four vehicles bumper to bumper. The bus and the dump truck will be on your bridge at the same time.' },
  { id: 'sandbox', name: 'Freestyle', gap: 40, floor: -10, top: 12, budget: Infinity, vehicles: ['dump'], pickVehicle: true,
    anchors: [[0, 0], [40, 0], [0, -3], [40, -3], [0, -6], [40, -6], [-1, 10], [41, 10], [20, -6]],
    pillars: [{ x0: 19, x1: 21, top: -6 }], towers: [{ x0: -2, x1: -1, base: 0, top: 10 }, { x0: 41, x1: 42, base: 0, top: 10 }], theme: 'sunset', photo: 'goldengate2',
    tip: 'Unlimited budget and any vehicle you like. Can you carry a semi truck 40 m without breaking a single beam?' },
];

// Fill in defaults so the rest of the code can rely on every field.
function prepLevel(lv) {
  if (lv._prepped) return lv;
  lv.leftY = lv.leftY || 0;
  lv.rightY = lv.rightY || 0;
  if (lv.water === undefined) lv.water = lv.floor + 1.6;
  lv.pillars = lv.pillars || [];
  lv.towers = (lv.towers || []).map(t => Object.assign({ base: 0 }, t));
  lv.noBuild = lv.noBuild || [];
  lv.materials = lv.materials || MATERIAL_KEYS.slice();
  lv.vehicles = lv.vehicles || ['car'];
  lv.convoyGap = lv.convoyGap || 3;
  lv._prepped = true;
  return lv;
}
LEVELS.forEach(prepLevel);

function viewBounds(lv) { return { xmin: -7, xmax: lv.gap + 7, ymin: lv.floor, ymax: lv.top + 1 }; }

// Is a grid point inside solid ground / a structure / a no-build zone?
function inTerrain(lv, x, y) {
  const e = 1e-6, vb = viewBounds(lv);
  if (x < vb.xmin - e || x > vb.xmax + e || y > lv.top + e || y < lv.floor + 1) return true;
  if (x <= e && y <= lv.leftY + e) return true;
  if (x >= lv.gap - e && y <= lv.rightY + e) return true;
  for (const p of lv.pillars) if (x >= p.x0 - e && x <= p.x1 + e && y <= p.top + e) return true;
  for (const t of lv.towers) if (!t.behind && x >= t.x0 - e && x <= t.x1 + e && y >= t.base - e && y <= t.top + e) return true;
  for (const z of lv.noBuild) if (x > z.x0 + e && x < z.x1 - e && y > z.y0 + e && y < z.y1 - e) return true;
  return false;
}
// Does a straight member pass through solid ground or a no-build zone? (Touching corners is fine.)
function segmentHitsTerrain(lv, a, b) {
  const m = 0.02;
  for (let k = 1; k < 40; k++) {
    const t = k / 40;
    const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    if (x < -m && y < lv.leftY - m) return true;
    if (x > lv.gap + m && y < lv.rightY - m) return true;
    for (const p of lv.pillars) if (x > p.x0 + m && x < p.x1 - m && y < p.top - m) return true;
    for (const tw of lv.towers) if (!tw.behind && x > tw.x0 + m && x < tw.x1 - m && y > tw.base + m && y < tw.top - m) return true;
    for (const z of lv.noBuild) if (x > z.x0 + m && x < z.x1 - m && y > z.y0 + m && y < z.y1 - m) return true;
  }
  return false;
}

function beamLength(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

function designCost(design) {
  const byId = new Map(design.nodes.map(n => [n.id, n]));
  let c = 0;
  for (const b of design.beams) c += beamLength(byId.get(b.a), byId.get(b.b)) * MATERIALS[b.mat].cost;
  return Math.round(c);
}

function makeBeam(nodes, ia, ib, mat, stub) {
  const A = nodes[ia], B = nodes[ib];
  const L = beamLength(A, B);
  const M = MATERIALS[mat];
  return { a: ia, b: ib, mat, L0: L, compliance: L / M.EA, tensionOnly: M.tensionOnly, strength: M.strength,
    comp: compStrength(mat, Math.max(L, 0.01)), force: 0, acc: 0, ratio: 0, broken: false, stub: !!stub };
}

function vehicleFront(V) { return V.length - V.rear; } // rear axle -> front bumper

function buildSim(level, design) {
  const lv = prepLevel(level);
  const nodes = design.nodes.map(n => ({ id: n.id, x: n.x, y: n.y, px: n.x, py: n.y, vx: 0, vy: 0, m: 0, w: 0, fixed: !!n.anchor, stubEnd: false }));
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const beams = design.beams.map(b => {
    const beam = makeBeam(nodes, idx.get(b.a), idx.get(b.b), b.mat);
    const mass = MATERIALS[b.mat].density * beam.L0;
    nodes[beam.a].m += mass / 2; nodes[beam.b].m += mass / 2;
    return beam;
  });
  for (const n of nodes) n.w = (n.fixed || n.m === 0) ? 0 : 1 / n.m;
  const vehicles = [];
  let frontX = -0.8;
  let limit = 6;
  lv.vehicles.forEach(key => {
    const V = VEHICLES[key];
    const x = frontX - vehicleFront(V);
    vehicles.push({ V, x, v: 0, state: 'wait', delay: 1.4,
      axles: V.axles.map(a => ({ dx: a[0], share: a[1], seg: -1, t: 0, y: lv.leftY })),
      yb: lv.leftY, vb: 0, lf: 1, stall: 0, rot: 0, fall: null, splashed: false });
    frontX = x - V.rear - lv.convoyGap;
    limit += (V.length + lv.convoyGap) / V.speed;
  });
  const slowest = Math.min(...vehicles.map(v => v.V.speed));
  limit += (lv.gap + 12) / slowest * 1.6 + 10;
  return { level: lv, nodes, beams, vehicles, time: 0, result: null, maxRatio: 0, brokenCount: 0, events: [], limit };
}

// Where does a wheel at x rest? Ground on the banks, otherwise the nearest drivable road beam.
function findSupport(sim, wx, prevY) {
  const lv = sim.level;
  if (wx <= 0 && prevY > lv.leftY - 0.8) return { seg: -1, t: 0, y: lv.leftY };
  if (wx >= lv.gap && prevY > lv.rightY - 0.8) return { seg: -1, t: 0, y: lv.rightY };
  let best = null, bd = Infinity;
  for (let i = 0; i < sim.beams.length; i++) {
    const b = sim.beams[i];
    if (b.broken || b.stub || b.mat !== 'road') continue;
    const A = sim.nodes[b.a], B = sim.nodes[b.b];
    const dxs = B.x - A.x;
    const lo = Math.min(A.x, B.x), hi = Math.max(A.x, B.x);
    if (hi - lo < 0.05 || wx < lo || wx > hi) continue;
    if (Math.abs(B.y - A.y) > 1.2 * Math.abs(dxs)) continue; // too steep to drive on
    const t = (wx - A.x) / dxs;
    const y = A.y + t * (B.y - A.y);
    const dy = y - prevY;
    if (dy > 0.7 || dy < -1.5) continue;
    if (Math.abs(dy) < bd) { bd = Math.abs(dy); best = { seg: i, t, y }; }
  }
  return best;
}

// A member snaps into two half-length stubs that stay pinned to their joints and dangle.
function breakBeam(sim, i) {
  const nodes = sim.nodes, b = sim.beams[i];
  b.broken = true; sim.brokenCount++;
  const A = nodes[b.a], B = nodes[b.b];
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
  const mvx = (A.vx + B.vx) / 2, mvy = (A.vy + B.vy) / 2;
  const q = MATERIALS[b.mat].density * b.L0 / 4;
  sim.events.push({ type: 'break', i, x: mx, y: my, mat: b.mat, force: b.force });
  for (const ei of [b.a, b.b]) {
    const E = nodes[ei];
    if (!E.fixed && E.m > q * 1.01) { E.m -= q; E.w = 1 / E.m; }
    const f = 0.48;
    const n = { id: 's' + nodes.length, x: E.x + (mx - E.x) * 2 * f, y: E.y + (my - E.y) * 2 * f, px: 0, py: 0,
      vx: mvx + (Math.random() - 0.5) * 1.5, vy: mvy + (Math.random() - 0.5) * 1.5, m: q, w: 1 / q, fixed: false, stubEnd: true };
    n.px = n.x; n.py = n.y;
    nodes.push(n);
    sim.beams.push(makeBeam(nodes, ei, nodes.length - 1, b.mat, true));
  }
}

function stepSim(sim, dt, substeps) {
  if (!substeps) substeps = 40;
  const h = dt / substeps, h2 = h * h;
  const nodes = sim.nodes, beams = sim.beams, lv = sim.level;
  // heavy damping while the bridge settles under its own weight (as if built gradually), light afterwards
  const damp = Math.exp(-(sim.time < 1.2 ? 6 : 0.8) * h), wdamp = Math.exp(-4 * h);
  const g = GRAV * Math.min(1, sim.time / 0.9); // ease gravity in so the bridge settles gently
  const BEAM_DAMP = 0.06;
  const floorY = lv.floor + 0.15, waterY = lv.water;
  for (const b of beams) b.acc = 0;

  // vehicle axle loads (dynamic: suspension bounce scales them)
  const loads = [];
  for (const veh of sim.vehicles) {
    if (veh.state !== 'drive') continue;
    for (const a of veh.axles) {
      if (a.seg < 0 || beams[a.seg].broken) continue;
      loads.push(beams[a.seg], a.t, a.share * veh.V.mass * GRAV * veh.lf);
    }
  }
  const W = lv.wind;
  const nb = beams.length;

  for (let s = 0; s < substeps; s++) {
    for (const n of nodes) {
      if (n.w === 0) continue;
      n.vy -= g * h;
      if (n.y < waterY) { n.vx *= wdamp; n.vy *= wdamp; n.vy += 0.3 * g * h; } // drag + a little buoyancy
      else { n.vx *= damp; n.vy *= damp; }
    }
    for (let k = 0; k < loads.length; k += 3) {
      const b = loads[k], t = loads[k + 1], F = loads[k + 2];
      const A = nodes[b.a], B = nodes[b.b];
      A.vy -= F * (1 - t) * A.w * h;
      B.vy -= F * t * B.w * h;
    }
    if (W) {
      // gusts heave the road deck as a travelling wave
      const tt = sim.time + s * h;
      const ramp = Math.min(1, tt / W.ramp);
      const env = ramp * ramp * (0.75 + 0.25 * Math.sin(tt * 0.9));
      for (let i = 0; i < nb; i++) {
        const b = beams[i];
        if (b.broken || b.stub || b.mat !== 'road') continue;
        const A = nodes[b.a], B = nodes[b.b];
        const xm = (A.x + B.x) / 2;
        const f = W.amp * b.L0 * env * Math.sin(2 * Math.PI * (tt / W.period - xm / W.wavelength)) * 0.5 * h;
        A.vy += f * A.w; B.vy += f * B.w;
      }
    }
    for (const n of nodes) {
      n.px = n.x; n.py = n.y;
      if (n.w === 0) continue;
      n.x += n.vx * h; n.y += n.vy * h;
    }
    for (let i = 0; i < nb; i++) {
      const b = beams[i];
      if (b.broken) continue;
      const A = nodes[b.a], B = nodes[b.b];
      const wsum = A.w + B.w;
      if (wsum === 0) continue;
      let dx = A.x - B.x, dy = A.y - B.y;
      const len = Math.hypot(dx, dy) || 1e-9;
      const C = len - b.L0;
      if (b.tensionOnly && C < 0) continue;
      const alphaT = b.compliance / h2;
      const dl = -C / (wsum + alphaT);
      dx /= len; dy /= len;
      A.x += A.w * dl * dx; A.y += A.w * dl * dy;
      B.x -= B.w * dl * dx; B.y -= B.w * dl * dy;
      b.acc += -dl / h2; // tension positive, compression negative
    }
    for (const n of nodes) {
      if (n.w === 0) continue;
      const wasAbove = n.py >= waterY;
      n.vx = (n.x - n.px) / h; n.vy = (n.y - n.py) / h;
      if (wasAbove && n.y < waterY && n.vy < -2 && sim.events.length < 40) sim.events.push({ type: 'splash', x: n.x, y: waterY, size: Math.min(1, n.m / 300) });
      if (n.y < floorY) { n.y = floorY; if (n.vy < 0) n.vy = 0; n.vx *= 0.9; }
    }
    // axial damping: kills vibration along each member without affecting rigid motion
    for (let i = 0; i < nb; i++) {
      const b = beams[i];
      if (b.broken) continue;
      const A = nodes[b.a], B = nodes[b.b];
      const wsum = A.w + B.w;
      if (wsum === 0) continue;
      let nx = B.x - A.x, ny = B.y - A.y;
      const len = Math.hypot(nx, ny) || 1e-9;
      if (b.tensionOnly && len < b.L0) continue;
      nx /= len; ny /= len;
      const rv = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
      const p = -rv * BEAM_DAMP / wsum;
      A.vx -= p * A.w * nx; A.vy -= p * A.w * ny;
      B.vx += p * B.w * nx; B.vy += p * B.w * ny;
    }
  }

  // forces + breaking (break only the worst member per frame so failures cascade visibly)
  let worst = -1, worstR = 1, maxR = 0;
  for (let i = 0; i < nb; i++) {
    const b = beams[i];
    if (b.broken || b.stub) { b.ratio = 0; continue; }
    b.force = b.acc / substeps;
    const r = b.force >= 0 ? b.force / b.strength : (b.comp > 0 ? -b.force / b.comp : 0);
    b.ratio = r;
    if (sim.time > 0.1) {
      if (r > maxR) maxR = r;
      if (r > worstR) { worstR = r; worst = i; }
    }
  }
  if (worst >= 0) breakBeam(sim, worst);
  sim.maxRatio = Math.max(sim.maxRatio, Math.min(maxR, 1));

  if (!sim.result) updateVehicles(sim, dt);
  else for (const veh of sim.vehicles) if (veh.state === 'fall' || veh.state === 'sunk') fallStep(sim, veh, dt);

  // shipping lanes: the loaded bridge must not sag into them
  if (!sim.result && sim.time > 0.3) {
    for (const z of lv.noBuild) {
      for (const b of beams) {
        if (b.broken || b.stub) continue;
        for (const n of [nodes[b.a], nodes[b.b]]) {
          if (n.x > z.x0 + 0.05 && n.x < z.x1 - 0.05 && n.y < z.y1 - 0.05 && n.y > z.y0) {
            sim.result = { ok: false, why: 'Your bridge sagged into the shipping lane and was struck by a passing ship.', code: 'ship' };
            sim.events.push({ type: 'ship', x: n.x, y: n.y });
            break;
          }
        }
        if (sim.result) break;
      }
      if (sim.result) break;
    }
  }
  if (!sim.result && sim.time > sim.limit) sim.result = { ok: false, why: 'Out of time.', code: 'time' };
  sim.time += dt;
}

function vehicleName(V) { return 'The ' + V.name.toLowerCase(); }

function startFall(sim, veh, lostIdx) {
  const r = veh.axles[0], f = veh.axles[veh.axles.length - 1];
  const xr = veh.x + r.dx, xf = veh.x + f.dx;
  const ang = Math.atan2(f.y - r.y, xf - xr);
  veh.fall = { cx: (xr + xf) / 2, cy: (r.y + f.y) / 2 + (veh.yb - avgContact(veh)), vx: veh.v * 0.85, vy: veh.vb * 0.5,
    ang, om: (lostIdx > 0 ? -1 : 1) * (0.7 + 0.4 * Math.random()) };
  veh.state = 'fall';
  for (const a of veh.axles) a.seg = -1;
}

function avgContact(veh) {
  let y = 0;
  for (const a of veh.axles) y += a.y * a.share;
  return y;
}

function fallStep(sim, veh, dt) {
  const F = veh.fall, lv = sim.level;
  if (veh.state === 'fall') {
    F.vy -= GRAV * dt;
    F.cx += F.vx * dt; F.cy += F.vy * dt; F.vx *= 0.995;
    F.ang += F.om * dt;
    if (F.cy < lv.water) {
      veh.state = 'sunk';
      sim.events.push({ type: 'splash', x: F.cx, y: lv.water, size: 3 });
      F.vy *= 0.2; F.vx *= 0.25; F.om *= 0.3;
    } else if (F.cy < lv.floor + 0.6) {
      veh.state = 'sunk'; F.vy = 0; F.vx = 0; F.om = 0; F.cy = lv.floor + 0.6;
      sim.events.push({ type: 'crash', x: F.cx, y: F.cy });
    }
  } else {
    F.vy = Math.max(F.vy - 0.6 * dt, -0.5);
    F.cy = Math.max(lv.floor + 0.6, F.cy + F.vy * dt); F.cx += F.vx * dt; F.vx *= 0.97;
    F.ang += F.om * dt; F.om *= 0.97;
  }
  return veh.state === 'sunk';
}

function updateVehicles(sim, dt) {
  const lv = sim.level;
  let allDone = true;
  for (let i = 0; i < sim.vehicles.length; i++) {
    const veh = sim.vehicles[i], V = veh.V;
    if (veh.state === 'wait') {
      veh.delay -= dt;
      if (veh.delay <= 0) veh.state = 'drive';
    }
    if (veh.state === 'drive') {
      const r = veh.axles[0], f = veh.axles[veh.axles.length - 1];
      const grade = (f.y - r.y) / Math.max(0.5, f.dx - r.dx);
      const gr = grade / V.maxGrade;
      let target = V.speed * (grade > V.maxGrade ? 0 : grade > 0 ? 1 - 0.75 * gr * gr : 1 + Math.min(0.25, -grade));
      const lead = sim.vehicles[i - 1];
      if (lead && (lead.state === 'drive' || lead.state === 'wait')) {
        const gap = (lead.x - lead.V.rear) - (veh.x + vehicleFront(V));
        const want = lv.convoyGap * 0.8;
        if (gap < want) target = Math.min(target, lead.v * Math.max(0, (gap - 0.8) / Math.max(0.1, want - 0.8)));
      }
      veh.v += Math.max(-4 * dt, Math.min(V.accel * dt, target - veh.v));
      if (veh.v < 0) veh.v = 0;
      if (grade > V.maxGrade && veh.v < 0.08) veh.stall += dt; else veh.stall = Math.max(0, veh.stall - dt);
      if (veh.stall > 2.5) {
        sim.result = { ok: false, why: vehicleName(V) + ' stalled on a ' + Math.round(grade * 100) + '% slope. It can only climb ' + Math.round(V.maxGrade * 100) + '%.', code: 'steep' };
        return;
      }
      veh.x += veh.v * dt;
      veh.rot += veh.v * dt / V.wheelR;
      for (let k = 0; k < veh.axles.length; k++) {
        const a = veh.axles[k];
        const sp = findSupport(sim, veh.x + a.dx, a.y);
        if (!sp) { startFall(sim, veh, k); break; }
        a.seg = sp.seg; a.t = sp.t; a.y = sp.y;
      }
      if (veh.state === 'drive') {
        // body on springs over the axles: bounce feeds back into the axle loads
        const yc = avgContact(veh);
        const K = 75, C = 9;
        const acc = -K * (veh.yb - yc) - C * veh.vb;
        veh.vb += acc * dt; veh.yb += veh.vb * dt;
        veh.lf = Math.max(0.4, Math.min(1.8, 1 + acc / GRAV));
        if (yc < lv.water + 0.4) {
          sim.result = { ok: false, why: vehicleName(V) + ' ended up in the water: the bridge sagged too far.', code: 'sag' };
          return;
        }
        if (veh.x > lv.gap + 2) veh.state = 'done';
      }
    }
    if (veh.state === 'done') { veh.x += veh.v * dt; veh.rot += veh.v * dt / V.wheelR; }
    if (veh.state === 'fall' || veh.state === 'sunk') {
      if (fallStep(sim, veh, dt)) {
        sim.result = { ok: false, why: vehicleName(V) + ' fell in!', code: 'fall' };
        return;
      }
    }
    if (veh.state !== 'done') allDone = false;
  }
  if (allDone) sim.result = { ok: true };
}
// PHYSICS-END

</script>

// ===================== SOUND (synthesised with Web Audio, no files) =====================
const Sound = {
  ac: null, master: null, on: true, noiseBuf: null, engine: null, wind: null,
  init() {
    if (this.ac || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate * 1.5;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setOn(v) {
    this.on = v;
    if (!v) { this.stopLoops(); if (this.ac) this.ac.suspend(); }
    else { this.init(); this.resume(); }
  },
  ok() { return this.on && this.ac && this.ac.state !== 'closed'; },
  noise(t0, dur, freq, q, gain, type) {
    const ac = this.ac, src = ac.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
    return f;
  },
  tone(t0, dur, freq, gain, type, freqEnd) {
    const ac = this.ac, o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0); if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  click() { if (!this.ok()) return; const t = this.ac.currentTime; this.tone(t, 0.05, 1500, 0.08, 'triangle', 900); },
  erase() { if (!this.ok()) return; const t = this.ac.currentTime; this.noise(t, 0.08, 2500, 1.5, 0.12); },
  snap(mat, big) {
    if (!this.ok()) return;
    const t = this.ac.currentTime, k = big ? 1.3 : 1;
    if (mat === 'wood') { this.noise(t, 0.22, 900, 1.1, 0.5 * k); this.noise(t, 0.08, 3000, 2, 0.25); this.tone(t, 0.12, 180, 0.25, 'triangle', 70); }
    else if (mat === 'steel') { this.noise(t, 0.12, 2600, 3, 0.35 * k); this.tone(t, 0.6, 1180 + Math.random() * 200, 0.12, 'sine', 900); this.tone(t, 0.45, 2390, 0.05, 'sine'); this.tone(t, 0.2, 120, 0.3, 'sine', 50); }
    else if (mat === 'cable') { this.tone(t, 0.5, 320, 0.22, 'sawtooth', 70); this.noise(t, 0.15, 4000, 1, 0.2); }
    else { this.noise(t, 0.3, 500, 0.8, 0.5 * k); this.tone(t, 0.25, 110, 0.35, 'sine', 45); }
  },
  splash(size) {
    if (!this.ok()) return;
    const t = this.ac.currentTime, f = this.noise(t, 0.4 + size * 0.35, 1400, 0.7, Math.min(0.7, 0.2 + size * 0.25), 'lowpass');
    f.frequency.exponentialRampToValueAtTime(260, t + 0.6 + size * 0.3);
  },
  thunder() { if (!this.ok()) return; const t = this.ac.currentTime; this.noise(t, 2.2, 120, 0.6, 0.6, 'lowpass'); this.noise(t + 0.1, 1.2, 300, 0.5, 0.25, 'lowpass'); },
  win() { if (!this.ok()) return; const t = this.ac.currentTime; [523, 659, 784, 1047].forEach((f, i) => this.tone(t + i * 0.11, 0.5, f, 0.16, 'triangle')); },
  lose() { if (!this.ok()) return; const t = this.ac.currentTime; [392, 330, 262].forEach((f, i) => this.tone(t + i * 0.16, 0.45, f, 0.14, 'triangle')); },
  // continuous engine hum, pitch follows the fastest vehicle
  setEngine(level, speed) {
    if (!this.ok()) return;
    const ac = this.ac;
    if (!this.engine) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 45;
      const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = 22.5;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
      const g = ac.createGain(); g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o.start(); o2.start();
      this.engine = { o, o2, g };
    }
    const t = ac.currentTime;
    this.engine.g.gain.setTargetAtTime(level * 0.07, t, 0.15);
    this.engine.o.frequency.setTargetAtTime(38 + speed * 14, t, 0.2);
    this.engine.o2.frequency.setTargetAtTime(19 + speed * 7, t, 0.2);
  },
  setWind(level) {
    if (!this.ok()) return;
    const ac = this.ac;
    if (!this.wind) {
      const src = ac.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.6;
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
      this.wind = { src, f, g };
    }
    const t = ac.currentTime;
    this.wind.g.gain.setTargetAtTime(level * 0.22, t, 0.3);
    this.wind.f.frequency.setTargetAtTime(300 + level * 500, t, 0.3);
  },
  stopLoops() {
    const t = this.ac ? this.ac.currentTime : 0;
    if (this.engine) this.engine.g.gain.setTargetAtTime(0, t, 0.1);
    if (this.wind) this.wind.g.gain.setTargetAtTime(0, t, 0.2);
  },
};

// ===================== RENDERING =====================
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash1(n, seed) { const v = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); }
function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i, seed) * (1 - u) + hash1(i + 1, seed) * u; }
function fbm(x, seed) { return vnoise(x, seed) * 0.6 + vnoise(x * 2.1, seed + 3) * 0.27 + vnoise(x * 4.7, seed + 7) * 0.13; }
function shade(hex, amt) {
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  const n = parseInt(c, 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; } else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function theme() { return THEMES[level.theme] || THEMES.meadow; }

// ---------- rock texture (per theme, cached) ----------
const rockPatterns = {};
function rockTile(T) {
  const key = T.rock.join();
  if (rockPatterns[key]) return rockPatterns[key];
  const cv = document.createElement('canvas'); cv.width = cv.height = 192;
  const c = cv.getContext('2d'), rnd = mulberry32(hashStr(key));
  c.fillStyle = T.rock[0]; c.fillRect(0, 0, 192, 192);
  for (let i = 0; i < 70; i++) {
    const x = rnd() * 192, y = rnd() * 192, w = 10 + rnd() * 34, h = 5 + rnd() * 14;
    c.fillStyle = rnd() < 0.5 ? T.rock[1] : T.rock[2];
    c.globalAlpha = 0.25 + rnd() * 0.35;
    c.beginPath();
    for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2; const rr = 0.7 + rnd() * 0.5; c.lineTo(x + Math.cos(a) * w * rr / 2, y + Math.sin(a) * h * rr / 2); }
    c.fill();
    for (const [dx, dy] of [[192, 0], [-192, 0], [0, 192], [0, -192]]) { c.save(); c.translate(dx, dy); c.fill(); c.restore(); }
  }
  c.globalAlpha = 0.18; c.strokeStyle = '#000';
  for (let y = 12; y < 192; y += 22 + rnd() * 10) { c.lineWidth = 1 + rnd(); c.beginPath(); c.moveTo(0, y); for (let x = 0; x <= 192; x += 16) c.lineTo(x, y + (rnd() - 0.5) * 4); c.stroke(); }
  c.globalAlpha = 1;
  return (rockPatterns[key] = cv);
}
function patternFill(c, tile, worldScale) {
  const p = c.createPattern(tile, 'repeat');
  if (p && p.setTransform && typeof DOMMatrix !== 'undefined') p.setTransform(new DOMMatrix().translateSelf(view.ox, view.oy).scaleSelf(worldScale, worldScale));
  return p;
}

// ---------- cached background: sky, far scenery, terrain ----------
const bgCv = document.createElement('canvas');
let bgKey = '';
function ensureBackground() {
  const key = [W, H, DPR, level.id, view.s.toFixed(3), view.ox.toFixed(1), view.oy.toFixed(1)].join('|');
  if (key === bgKey) return;
  bgKey = key;
  bgCv.width = Math.max(1, Math.round(W * DPR)); bgCv.height = Math.max(1, Math.round(H * DPR));
  const c = bgCv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const T = theme();
  drawSky(c, T);
  drawFar(c, T);
  drawTerrain(c, T);
}

function drawSky(c, T) {
  const g = c.createLinearGradient(0, 0, 0, H);
  T.sky.forEach((col, i) => g.addColorStop(i / (T.sky.length - 1), col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const rnd = mulberry32(hashStr(level.id + 'sky'));
  if (T.stars) {
    for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.7})`; const r = rnd() < 0.1 ? 1.8 : 1.1; c.fillRect(rnd() * W, rnd() * H * 0.55, r, r); }
  }

    const [fx, fy, col, r] = T.sun, x = fx * W, y = fy * H;
    const glow = c.createRadialGradient(x, y, 0, x, y, r * 5);
    glow.addColorStop(0, col); glow.addColorStop(0.25, col.length === 7 ? col + '88' : col); glow.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = glow; c.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
    c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  for (let i = 0; i < (T.clouds || 0); i++) {
    const cx = (rnd() * 1.3 - 0.15) * W + view.ox * 0.04, cy = (0.06 + rnd() * 0.3) * H, w = W * (0.07 + rnd() * 0.12), h = w * (0.28 + rnd() * 0.12);
    for (let k = 0; k < 7; k++) {
      const px = cx + (rnd() - 0.5) * w, py = cy + (rnd() - 0.5) * h * 0.6, pr = h * (0.45 + rnd() * 0.5);
      const g2 = c.createRadialGradient(px, py, 0, px, py, pr);
      g2.addColorStop(0, T.cloud + 'ee'); g2.addColorStop(0.6, T.cloud + '99'); g2.addColorStop(1, T.cloud + '00');
      c.fillStyle = g2; c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.fill();
    }
  }
}

function horizonY() { return Math.max(level.leftY, level.rightY) + 0.6; }

function drawFar(c, T) {
  const lv = level, base = sy(horizonY()), seedBase = hashStr(lv.id) % 1000;
  if (T.sea) {
    const g = c.createLinearGradient(0, base - 2, 0, H);
    g.addColorStop(0, shade(T.water[0], 0.25)); g.addColorStop(1, T.water[1]);
    c.fillStyle = g; c.fillRect(0, base - 1, W, H - base + 1);
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(0, base - 1, W, 1.5);
  }
  const n = T.layers.length;
  T.layers.forEach(([col, kind, height, vary], i) => {
    const p = 0.1 + 0.16 * i + (n === 1 ? 0.15 : 0);   // parallax: far layers move less
    const sc = view.s * (0.55 + p);                      // and look smaller
    const seed = seedBase + i * 17;
    const lift = (n - 1 - i) * 0.35 * sc;                // farther layers sit a little higher
    const yb = base - lift;
    if (kind === 'city') { drawCity(c, col, height, sc, p, seed, yb, T.lights); return; }
    c.beginPath(); c.moveTo(-5, H);
    for (let x = -5; x <= W + 6; x += 5) {
      const u = (x - view.ox * p) / sc;
      let h;
      if (kind === 'hill') h = height * (0.55 + 0.45 * Math.sin(u * 0.09 + seed)) + vary * (fbm(u * 0.12, seed) - 0.5);
      else { const r = fbm(u * 0.085, seed); h = height * (0.25 + 0.75 * Math.pow(1 - Math.abs(2 * r - 1), 1.5)) + vary * (fbm(u * 0.3, seed + 1) - 0.5) * 0.6; }
      c.lineTo(x, yb - h * sc);
    }
    c.lineTo(W + 6, H); c.closePath();
    if (kind === 'snow') {
      const g = c.createLinearGradient(0, yb - (height + vary) * sc, 0, yb);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.32, '#eef3f8'); g.addColorStop(0.42, col); g.addColorStop(1, shade(col, -0.25));
      c.fillStyle = g;
    } else {
      const g = c.createLinearGradient(0, yb - height * sc, 0, yb + 40);
      g.addColorStop(0, shade(col, 0.08)); g.addColorStop(1, shade(col, -0.18));
      c.fillStyle = g;
    }
    c.fill();
    if (T.fog) {
      const g = c.createLinearGradient(0, yb - height * 0.4 * sc, 0, yb + 10);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(244,240,232,.75)');
      c.fillStyle = g; c.fillRect(0, yb - height * sc, W, H);
    }
  });
  if (lv.floor < -12) {
    const top = base + view.s * 1.2, rnd = mulberry32(seedBase + 5);
    c.beginPath(); c.moveTo(-5, H);
    for (let x = -5; x <= W + 6; x += 8) c.lineTo(x, top + (fbm((x - view.ox * 0.5) / (view.s * 1.4) * 0.3, seedBase) - 0.5) * view.s * 2.5);
    c.lineTo(W + 6, H); c.closePath();
    const g = c.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, shade(T.rock[2], 0.25)); g.addColorStop(0.5, shade(T.rock[0], 0.05)); g.addColorStop(1, shade(T.rock[1], -0.2));
    c.globalAlpha = 0.85; c.fillStyle = g; c.fill(); c.globalAlpha = 1;
    c.fillStyle = shade(T.trees[0] === 'pine' ? '#2f5d3a' : '#4f7a3a', 0);
    for (let k = 0; k < 60; k++) { const x = rnd() * W, y = top + rnd() * (H - top) * 0.7; c.globalAlpha = 0.25; c.beginPath(); c.arc(x, y, view.s * (0.3 + rnd() * 0.5), 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
    const hz = c.createLinearGradient(0, top, 0, H);
    hz.addColorStop(0, 'rgba(255,255,255,.18)'); hz.addColorStop(1, 'rgba(0,0,0,.25)');
    c.fillStyle = hz; c.fillRect(0, top - view.s * 2, W, H);
  }
}

function drawCity(c, col, height, sc, p, seed, yb, lights) {
  const bw = 2.6;
  const u0 = (-10 - view.ox * p) / sc, u1 = (W + 10 - view.ox * p) / sc;
  for (let i = Math.floor(u0 / bw) - 1; i <= Math.ceil(u1 / bw); i++) {
    const r = hash1(i, seed), r2 = hash1(i + 0.5, seed + 2);
    if (r2 < 0.12) continue;
    const w = bw * (0.6 + 0.4 * r2), h = height * (0.25 + 0.75 * r * r) + (r > 0.93 ? height * 0.6 : 0);
    const x = i * bw * sc + view.ox * p, ww = w * sc, hh = h * sc;
    c.fillStyle = col; c.fillRect(x, yb - hh, ww, hh + H);
    if (r > 0.93) c.fillRect(x + ww * 0.45, yb - hh - sc * 1.5, Math.max(1, ww * 0.08), sc * 1.5); // antenna
    if (lights && sc > 3) {
      c.fillStyle = 'rgba(255,214,140,.85)';
      const wx = Math.max(1.2, sc * 0.18), gap = sc * 0.55;
      for (let yy = yb - hh + gap * 0.6; yy < yb - 2; yy += gap) for (let xx = x + gap * 0.4; xx < x + ww - wx; xx += gap) {
        if (hash1(xx * 0.37 + yy * 1.7, seed) < 0.38) c.fillRect(xx, yy, wx, wx * 1.2);
      }
    }
  }
}

function drawTree(c, x, y, kind, color, hM, rnd) {
  const s = view.s, h = hM * s;
  if (kind === 'pine') {
    c.fillStyle = '#4a3423'; c.fillRect(x - h * 0.03, y - h * 0.18, h * 0.06, h * 0.18);
    c.fillStyle = color;
    for (let k = 0; k < 3; k++) {
      const yy = y - h * (0.15 + k * 0.27), ww = h * (0.34 - k * 0.08);
      c.beginPath(); c.moveTo(x - ww, yy); c.lineTo(x, yy - h * 0.42); c.lineTo(x + ww, yy); c.closePath(); c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.moveTo(x, y - h); c.lineTo(x + h * 0.34, y - h * 0.15); c.lineTo(x, y - h * 0.15); c.fill();
  } else if (kind === 'palm') {
    c.strokeStyle = '#6b4f33'; c.lineWidth = Math.max(1.5, h * 0.05); c.lineCap = 'round';
    const lean = (rnd() - 0.5) * h * 0.3;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * 0.2, y - h * 0.5, x + lean, y - h); c.stroke();
    c.strokeStyle = color; c.lineWidth = Math.max(1.2, h * 0.045);
    for (let k = 0; k < 6; k++) {
      const a = Math.PI * (0.1 + k * 0.16), L = h * 0.42;
      c.beginPath(); c.moveTo(x + lean, y - h);
      c.quadraticCurveTo(x + lean + Math.cos(a) * L * 0.6 * (k % 2 ? 1 : -1), y - h - L * 0.35, x + lean + Math.cos(a) * L * (k % 2 ? 1 : -1), y - h + L * 0.3);
      c.stroke();
    }
  } else {
    c.fillStyle = '#5a4128'; c.fillRect(x - h * 0.04, y - h * 0.45, h * 0.08, h * 0.45);
    const cols = Array.isArray(color) ? color : [color];
    for (let k = 0; k < 5; k++) {
      c.fillStyle = cols[Math.floor(rnd() * cols.length)];
      c.beginPath(); c.arc(x + (rnd() - 0.5) * h * 0.4, y - h * (0.55 + rnd() * 0.3), h * (0.2 + rnd() * 0.12), 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.arc(x + h * 0.1, y - h * 0.55, h * 0.24, 0, Math.PI * 2); c.fill();
  }
}

function drawTerrain(c, T) {
  const lv = level, s = view.s;
  const rnd = mulberry32(hashStr(lv.id + 'trees'));
  // trees on the banks, behind the road
  const treeCols = T.trees[1];
  const spots = [];
  for (let x = -6.6; x < -1.2; x += 1.1 + rnd() * 0.9) spots.push([x, lv.leftY]);
  for (let x = lv.gap + 1.4; x < lv.gap + 6.8; x += 1.1 + rnd() * 0.9) spots.push([x, lv.rightY]);
  c.fillStyle = shade(T.grass, -0.15);
  c.fillRect(0, sy(lv.leftY) - Math.max(2, s * 0.14), sx(0), Math.max(2, s * 0.14) + 1);
  c.fillRect(sx(lv.gap), sy(lv.rightY) - Math.max(2, s * 0.14), W - sx(lv.gap), Math.max(2, s * 0.14) + 1);
  for (const [x, y] of spots) {
    if (lv.towers.some(t => !t.behind && x > t.x0 - 1 && x < t.x1 + 1)) continue;
    if (rnd() < 0.25) continue;
    const kind = T.trees[0], col = Array.isArray(treeCols) && kind !== 'round' ? treeCols[Math.floor(rnd() * treeCols.length)] : treeCols;
    drawTree(c, sx(x), sy(y) - s * 0.1, kind, col, 2.2 + rnd() * 2.2, rnd);
  }
  // riverbed
  const gx0 = sx(0), gx1 = sx(lv.gap);
  c.fillStyle = T.bed; c.fillRect(gx0, sy(lv.floor), gx1 - gx0, H - sy(lv.floor) + 2);
  c.fillStyle = 'rgba(0,0,0,.18)';
  for (let i = 0; i < 40; i++) { const x = gx0 + rnd() * (gx1 - gx0), y = sy(lv.floor) + rnd() * s * 0.6; c.beginPath(); c.ellipse(x, y, s * (0.08 + rnd() * 0.15), s * 0.06, 0, 0, Math.PI * 2); c.fill(); }
  // banks (rock)
  const pat = patternFill(c, rockTile(T), Math.max(0.15, s / 48));
  c.fillStyle = pat || T.rock[0];
  c.fillRect(-2, sy(lv.leftY), sx(0) + 2, H - sy(lv.leftY) + 2);
  c.fillRect(sx(lv.gap), sy(lv.rightY), W - sx(lv.gap) + 2, H - sy(lv.rightY) + 2);
  // cliff-face shading
  const fw = Math.max(6, s * 0.9);
  let g = c.createLinearGradient(sx(0) - fw, 0, sx(0), 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = g; c.fillRect(sx(0) - fw, sy(lv.leftY), fw, H);
  g = c.createLinearGradient(sx(lv.gap), 0, sx(lv.gap) + fw, 0); g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(sx(lv.gap), sy(lv.rightY), fw, H);
  // soil + road surface on top of the banks
  for (const [xa, xb, y] of [[-50, 0, lv.leftY], [lv.gap, lv.gap + 50, lv.rightY]]) {
    const X0 = sx(xa), X1 = sx(xb), Y = sy(y), rt = Math.max(3, s * 0.3);
    c.fillStyle = '#4a3a2a'; c.fillRect(X0, Y, X1 - X0, rt * 1.9);
    c.fillStyle = '#35363b'; c.fillRect(X0, Y, X1 - X0, rt);
    c.fillStyle = '#8d8f96'; c.fillRect(X0, Y, X1 - X0, Math.max(1, rt * 0.16));
    if (s > 10) {
      c.fillStyle = '#e8d36a';
      const dash = s * 0.9;
      for (let x = Math.ceil(xa) * s + view.ox; x < X1; x += dash * 2) if (x + dash > X0) c.fillRect(Math.max(X0, x), Y + rt * 0.42, Math.min(dash, X1 - x), Math.max(1, rt * 0.12));
    }
  }
  // pillars (concrete piers)
  for (const p of lv.pillars) {
    const X0 = sx(p.x0), X1 = sx(p.x1), Y0 = sy(p.top), Y1 = sy(lv.floor) + 4;
    g = c.createLinearGradient(X0, 0, X1, 0);
    g.addColorStop(0, '#c9ccd0'); g.addColorStop(0.55, '#a7abb1'); g.addColorStop(1, '#7d828a');
    c.fillStyle = g; c.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
    c.fillStyle = 'rgba(0,0,0,.08)';
    for (let y = Y0 + s; y < Y1; y += s * 1.2) c.fillRect(X0, y, X1 - X0, 1);
    c.fillStyle = '#d7dadd'; c.fillRect(X0 - s * 0.15, Y0, X1 - X0 + s * 0.3, Math.max(2, s * 0.25));
  }
  // towers
  for (const t of lv.towers) {
    const X0 = sx(t.x0), X1 = sx(t.x1), Y0 = sy(t.top), Y1 = sy(t.base);
    g = c.createLinearGradient(X0, 0, X1, 0);
    if (t.behind) { g.addColorStop(0, '#b9bec6'); g.addColorStop(1, '#8b929c'); }
    else { g.addColorStop(0, '#c2b8a6'); g.addColorStop(0.6, '#a39885'); g.addColorStop(1, '#7f7564'); }
    c.globalAlpha = t.behind ? 0.85 : 1;
    c.fillStyle = g;
    c.beginPath(); c.moveTo(X0 - s * 0.12, Y1); c.lineTo(X0 + s * 0.05, Y0); c.lineTo(X1 - s * 0.05, Y0); c.lineTo(X1 + s * 0.12, Y1); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,.12)';
    for (let y = Y0 + s * 1.5; y < Y1 - s * 0.5; y += s * 2.5) c.fillRect(X0, y, X1 - X0, Math.max(1, s * 0.12));
    c.fillStyle = t.behind ? '#d2d6dc' : '#d6ccb9'; c.fillRect(X0 - s * 0.12, Y0 - s * 0.2, X1 - X0 + s * 0.24, Math.max(2, s * 0.3));
    c.globalAlpha = 1;
  }
}

// ---------- water ----------
function drawWater(t) {
  const lv = level, T = theme();
  const x0 = sx(0), x1 = sx(lv.gap), yw = sy(lv.water), yb = sy(lv.floor);
  if (yw >= yb) return;
  const g = ctx.createLinearGradient(0, yw, 0, yb);
  g.addColorStop(0, T.water[0]); g.addColorStop(1, T.water[1]);
  ctx.globalAlpha = 0.9; ctx.fillStyle = g; ctx.fillRect(x0, yw, x1 - x0, yb - yw); ctx.globalAlpha = 1;
  if (T.reflectSun && T.sun) {
    const sxp = T.sun[0] * W;
    if (sxp > x0 && sxp < x1) {
      const g2 = ctx.createLinearGradient(0, yw, 0, yb);
      g2.addColorStop(0, 'rgba(255,214,140,.55)'); g2.addColorStop(1, 'rgba(255,214,140,0)');
      ctx.fillStyle = g2; ctx.fillRect(sxp - view.s * 1.2, yw, view.s * 2.4, yb - yw);
    }
  }
}
function drawWaterSurface(t) {
  const lv = level;
  const x0 = sx(0), x1 = sx(lv.gap), yw = sy(lv.water), yb = sy(lv.floor);
  if (yw >= yb) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, yw, x1 - x0, yb - yw); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  const s = view.s;
  for (let k = 0; k < 7; k++) {
    const yy = yw + 3 + k * k * s * 0.07;
    if (yy > yb) break;
    ctx.globalAlpha = 0.9 - k * 0.11;
    ctx.beginPath();
    const ph = t * (0.6 + k * 0.15) + k * 1.7;
    for (let x = x0 + ((k * 37) % 23); x < x1; x += s * (1.4 + k * 0.2)) {
      const off = Math.sin(x * 0.05 + ph) * s * 0.3;
      ctx.moveTo(x + off, yy); ctx.lineTo(x + off + s * (0.4 + 0.2 * Math.sin(ph + x)), yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x0, yw - 0.5, x1 - x0, 1.5);
  ctx.restore();
}
function drawWaterFront() {
  const lv = level, T = theme();
  const x0 = sx(0), x1 = sx(lv.gap), yw = sy(lv.water), yb = sy(lv.floor);
  if (yw >= yb) return;
  ctx.globalAlpha = 0.38; ctx.fillStyle = T.water[1]; ctx.fillRect(x0, yw, x1 - x0, yb - yw); ctx.globalAlpha = 1;
}

// ---------- structure ----------
function drawMember(ax, ay, bx, by, mat, tint, stubEnd) {
  const M = MATERIALS[mat], s = view.s;
  let x1 = sx(ax), y1 = sy(ay), x2 = sx(bx), y2 = sy(by);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 0.5) return;
  const w = Math.max(mat === 'cable' ? 1.4 : mat === 'road' ? 4.5 : 3, M.width * s);
  const line = (xa, ya, xb, yb, col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke(); };
  ctx.lineCap = mat === 'cable' ? 'round' : 'butt';
  if (mat === 'cable') {
    line(x1, y1, x2, y2, 'rgba(0,0,0,.55)', w + 1.2);
    line(x1, y1, x2, y2, tint || '#2c2d31', w);
    if (!tint && w > 2) line(x1, y1, x2, y2, 'rgba(255,255,255,.22)', Math.max(0.6, w * 0.3));
  } else if (mat === 'road') {
    if (x2 < x1) { [x1, x2] = [x2, x1]; [y1, y2] = [y2, y1]; }
    const ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = uy, ny = -ux; // n points screen-up
    line(x1, y1, x2, y2, '#141519', w + 2);
    line(x1, y1, x2, y2, tint || '#3b3c43', w);
    const ko = w * 0.38;
    line(x1 + nx * ko, y1 + ny * ko, x2 + nx * ko, y2 + ny * ko, tint ? 'rgba(255,255,255,.35)' : '#9b9da5', Math.max(1, w * 0.16));
    line(x1 - nx * ko, y1 - ny * ko, x2 - nx * ko, y2 - ny * ko, 'rgba(0,0,0,.35)', Math.max(1, w * 0.14));
    if (!tint && s > 9) {
      ctx.setLineDash([s * 0.45, s * 0.45]);
      line(x1, y1, x2, y2, '#f1d35a', Math.max(0.8, w * 0.1));
      ctx.setLineDash([]);
    }
    if (s > 20) { // railing
      const ro = s * 0.55, n = Math.max(1, Math.round(len / s));
      ctx.strokeStyle = tint ? 'rgba(255,255,255,.45)' : 'rgba(205,210,218,.9)'; ctx.lineWidth = Math.max(1, s * 0.04);
      ctx.beginPath();
      ctx.moveTo(x1 + nx * (ro + ko), y1 + ny * (ro + ko)); ctx.lineTo(x2 + nx * (ro + ko), y2 + ny * (ro + ko));
      for (let k = 0; k <= n; k++) { const f = k / n, px = x1 + (x2 - x1) * f, py = y1 + (y2 - y1) * f; ctx.moveTo(px + nx * ko, py + ny * ko); ctx.lineTo(px + nx * (ro + ko), py + ny * (ro + ko)); }
      ctx.stroke();
    }
  } else if (mat === 'wood') {
    line(x1, y1, x2, y2, '#3b2a17', w + 1.6);
    line(x1, y1, x2, y2, tint || '#b8864e', w);
    if (w > 3.5) {
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux, o = w * 0.22;
      const gc = tint ? 'rgba(0,0,0,.18)' : 'rgba(84,52,22,.5)';
      line(x1 + nx * o, y1 + ny * o, x2 + nx * o, y2 + ny * o, gc, Math.max(0.6, w * 0.08));
      line(x1 - nx * o * 0.6, y1 - ny * o * 0.6, x2 - nx * o * 0.6, y2 - ny * o * 0.6, gc, Math.max(0.6, w * 0.06));
    }
  } else { // steel
    line(x1, y1, x2, y2, '#2a1410', w + 1.6);
    line(x1, y1, x2, y2, tint || '#c4513a', w);
    if (w > 3.5) {
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux, o = w * 0.34;
      line(x1 + nx * o, y1 + ny * o, x2 + nx * o, y2 + ny * o, 'rgba(0,0,0,.28)', Math.max(0.6, w * 0.16));
      line(x1 - nx * o, y1 - ny * o, x2 - nx * o, y2 - ny * o, 'rgba(255,255,255,.18)', Math.max(0.6, w * 0.14));
      if (s > 26 && !tint) {
        ctx.fillStyle = 'rgba(40,16,12,.55)';
        const n = Math.floor(len / (s * 0.5));
        for (let k = 1; k < n; k++) { const f = k / n; ctx.fillRect(x1 + (x2 - x1) * f - 1, y1 + (y2 - y1) * f - 1, 2, 2); }
      }
    }
  }
  if (stubEnd) { // splintered / torn end
    const ux = (x2 - x1) / len, uy = (y2 - y1) / len, nx = -uy, ny = ux;
    ctx.strokeStyle = mat === 'wood' ? '#e2b880' : mat === 'steel' ? '#ffcf8a' : '#888';
