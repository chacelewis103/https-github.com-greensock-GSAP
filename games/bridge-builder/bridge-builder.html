      if (ev.mat === 'steel' || ev.mat === 'cable') burst(ev.x, ev.y, 8, { color: '#ffd27a', kind: 'spark', spread: 10, up: 6, decay: 2.5 });
      Sound.snap(ev.mat, Math.abs(ev.force) > 80000);
      shake = Math.min(1, shake + 0.3);
    } else if (ev.type === 'splash') {
      burst(ev.x, ev.y, Math.round(6 + ev.size * 10), { color: ['#d8ecfb', '#a9d2f2', '#ffffff'], kind: 'drop', size: 0.1, up: 3 + ev.size * 3, spread: 3 + ev.size * 2, decay: 0.9 });
      if (clock - lastSplash > 0.12 || ev.size > 2) { Sound.splash(ev.size); lastSplash = clock; }
    } else if (ev.type === 'crash') {
      burst(ev.x, ev.y, 18, { color: ['#8a7a68', '#5a4a3a'], size: 0.15, up: 3 });
      Sound.snap('road', true); shake = 1;
    } else if (ev.type === 'ship') {
      burst(ev.x, ev.y, 14, { color: ['#ffd27a', '#ffffff'], kind: 'spark', spread: 8 });
      Sound.snap('steel', true); shake = 1;
    }
  }
  sim.events.length = 0;
}
function stepParticles(dt) {
  const wl = level.water;
  for (const p of particles) {
    p.vy -= GRAV * dt * (p.kind === 'spark' ? 0.4 : 1);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.life -= dt * p.decay;
    if (p.y < wl && p.vy < 0 && p.kind !== 'drop') p.life -= dt * 3;
    if (p.kind === 'drop' && p.y < wl && p.vy < 0) p.life = 0;
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
  particles = particles.filter(p => p.life > 0);
}
function windLevel(t) { const W2 = level.wind; if (!W2) return 0; const r = Math.min(1, t / W2.ramp); return r * r * (0.75 + 0.25 * Math.sin(t * 0.9)); }

// ---------- cards: briefing, levels, results, help, credits ----------
function openOverlay() { overlay.hidden = false; overlay.scrollTop = 0; }
function imgHTML(src, alt) { return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async">`; }
function wireImages(root, msg) {
  root.querySelectorAll('img').forEach(img => img.addEventListener('error', () => {
    const d = document.createElement('div'); d.className = 'noimg'; d.textContent = img.closest('.vimg') ? '' : (msg || '');
    img.replaceWith(d);
  }, { once: true }));
}
function vehChip(k, n, selectable) {
  const V = VEHICLES[k], P = VEHICLE_PHOTOS[k];
  const inner = `<div class="vimg">${imgHTML(photoURL(P, 330), V.name)}</div><div><b>${n > 1 ? n + ' × ' : ''}${V.name}</b>${(V.mass / 1000)} t · ${V.axles.length} axles · ${V.length} m</div>`;
  return selectable ? `<button class="veh${k === sandboxVehicle ? ' active' : ''}" data-veh="${k}">${inner}</button>` : `<div class="veh">${inner}</div>`;
}
function photoCaption(p) {
  return `<a href="${esc(photoPage(p))}" target="_blank" rel="noopener">Photo${p.credit ? ': ' + esc(p.credit) : ''} · Wikimedia Commons</a>`;
}
function showBriefing() {
  const p = PHOTOS[level.photo];
  const counts = {};
  for (const k of level.vehicles) counts[k] = (counts[k] || 0) + 1;
  const vehHtml = level.pickVehicle ? Object.keys(VEHICLES).map(k => vehChip(k, 1, true)).join('') : Object.entries(counts).map(([k, n]) => vehChip(k, n)).join('');
  const chips = [`↔ ${level.gap} m gap`, isFinite(level.budget) ? `💰 $${level.budget.toLocaleString()} budget` : '💰 Unlimited budget'];
  if (level.materials.length < MATERIAL_KEYS.length) chips.push('🧱 ' + level.materials.map(m => MATERIALS[m].name).join(' + ') + ' only');
  if (level.wind) chips.push('🌬 Gale-force gusts');
  if (level.noBuild.length) chips.push('⛴ Shipping lane below');
  if (level.rightY !== level.leftY) chips.push(`⬈ Far bank ${level.rightY - level.leftY > 0 ? '+' : ''}${level.rightY - level.leftY} m`);
  if (level.floor < -12) chips.push(`↧ ${-level.floor} m drop`);
  card.className = 'card brief'; card.style.maxWidth = '';
  card.innerHTML = `
    <div class="photo">${imgHTML(photoURL(p, 960), 'Photo of ' + p.title)}<div class="cap">Inspired by <b>${esc(p.title)}</b> · ${esc(p.place)}<br>${photoCaption(p)}</div></div>
    <div class="body">
      <h2>${levelIdx + 1}. ${esc(level.name)}</h2>
      <p class="fact">${esc(p.fact)}</p>
      <div class="specs">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
      <div class="vehicles">${vehHtml}</div>
      <p class="tip">💡 ${esc(level.tip)}</p>
      <div class="row"><button id="bLevels" class="ghost">☰ All levels</button><button id="bGo" class="active">Start building ▶</button></div>
    </div>`;
  openOverlay();
  wireImages(card, 'Real-world photo loads from Wikimedia Commons when you are online.');
  $('bGo').onclick = () => { overlay.hidden = true; toast(level.tip + (H > W * 1.1 ? ' (Tip: turn your phone sideways for a bigger view.)' : ''), 4500); };
  $('bLevels').onclick = showLevels;
  card.querySelectorAll('[data-veh]').forEach(b => b.onclick = () => {
    sandboxVehicle = b.dataset.veh; store('sandbox-vehicle', sandboxVehicle);
    card.querySelectorAll('[data-veh]').forEach(x => x.classList.toggle('active', x === b));
    $('lvInfo').textContent = level.gap + ' m · ' + vehicleSummary(level);
  });
}
function themeSwatch(t) { const T = THEMES[t] || THEMES.meadow; return `linear-gradient(180deg, ${T.sky[0]}, ${T.sky[T.sky.length - 1]} 60%, ${T.water[0]})`; }
function showLevels() {
  if (mode === 'sim') stopTest();
  const items = LEVELS.map((lv, i) => {
    const st = load('stars-' + lv.id) || 0, p = PHOTOS[lv.photo];
    return `<button class="lvcard${i === levelIdx ? ' cur' : ''}" data-i="${i}">
      <div class="thumb" style="--sw:${themeSwatch(lv.theme)}">${imgHTML(photoURL(p, 500), p.title)}<span class="num">${i + 1}</span></div>
      <div class="meta"><b>${esc(lv.name)}</b><span>${esc(p.title)}</span><span>${lv.gap} m · ${esc(vehicleSummary(lv))}</span>
      <span class="stars">${'★'.repeat(st)}<i>${'★'.repeat(3 - st)}</i></span></div></button>`;
  }).join('');
  const total = LEVELS.reduce((s, lv) => s + (load('stars-' + lv.id) || 0), 0);
  card.className = 'card wide'; card.style.maxWidth = '';
  card.innerHTML = `<h2>Choose a level</h2><p>${total} / ${LEVELS.length * 3} stars · Each level is inspired by a real bridge.</p><div class="grid">${items}</div>
    <div class="row"><button id="credBtn" class="ghost">Photo credits</button><button id="lvClose" class="active">Close</button></div>`;
  openOverlay();
  wireImages(card, '');
  card.querySelectorAll('.lvcard').forEach(b => b.onclick = () => loadLevel(+b.dataset.i, true));
  $('lvClose').onclick = () => { overlay.hidden = true; };
  $('credBtn').onclick = showCredits;
}
function starsFor(cost, broken) {
  if (!isFinite(level.budget)) return broken === 0 ? 3 : broken < 6 ? 2 : 1;
  return cost <= level.star3 ? 3 : cost <= level.star2 ? 2 : 1;
}
const FAIL_HINTS = {
  fall: 'Red members were the most stressed. Add triangles, use steel where it turns red, and keep compression members short.',
  sag: 'The deck sagged into the water. Stiffen it with a deeper truss or more supports.',
  ship: 'Keep everything above the lane, and stiffen the deck so it does not sag into it under load.',
  steep: 'Make the climb gentler: run each road member at least 4 m across for every 1 m up.',
  time: 'The vehicle got stuck. Check that the road is continuous from bank to bank.',
};
function showResult(res) {
  const cost = designCost(design), p = PHOTOS[level.photo];
  let html;
  if (res.ok) {
    const stars = starsFor(cost, sim.brokenCount);
    const prev = load('stars-' + level.id) || 0;
    if (stars > prev) store('stars-' + level.id, stars);
    const next = levelIdx < LEVELS.length - 1;
    html = `<h2>🎉 It held!</h2>
      <div class="stars">${'★'.repeat(stars)}<i>${'★'.repeat(3 - stars)}</i></div>
      <p>Cost <b>$${cost.toLocaleString()}</b>${isFinite(level.budget) ? ` · ★★ ≤ $${level.star2.toLocaleString()} · ★★★ ≤ $${level.star3.toLocaleString()}` : ''}</p>
      <p>Peak stress <b>${Math.round(sim.maxRatio * 100)}%</b> · Broken members <b>${sim.brokenCount}</b></p>
      <p class="fact" style="font-size:13px">🌉 ${esc(p.title)}: ${esc(p.fact)}</p>
      <div class="row"><button id="rEdit">Edit bridge</button><button id="rWatch" class="ghost">Watch</button>${next ? '<button id="rNext" class="active">Next level ▶</button>' : ''}</div>`;
  } else {
    html = `<h2>💥 ${res.code === 'ship' ? 'Ship strike!' : res.code === 'steep' ? 'Too steep!' : 'Collapsed'}</h2><p style="color:#e9eff8">${esc(res.why)}</p>
      <p>Broken members: <b>${sim.brokenCount}</b> · Peak stress <b>${Math.round(sim.maxRatio * 100)}%</b></p>
      <p class="tip">💡 ${esc(FAIL_HINTS[res.code] || FAIL_HINTS.fall)}</p>
      <div class="row"><button id="rEdit" class="active">Edit bridge</button><button id="rWatch" class="ghost">Watch</button><button id="rRetry">Retry</button></div>`;
  }
  card.className = 'card'; card.style.maxWidth = ''; card.innerHTML = html; openOverlay();
  $('rEdit').onclick = stopTest;
  $('rWatch').onclick = () => { overlay.hidden = true; resultDismissed = true; };
  const nx = $('rNext'); if (nx) nx.onclick = () => loadLevel(levelIdx + 1, true);
  const rt = $('rRetry'); if (rt) rt.onclick = () => { stopTest(); toggleTest(); };
}
function showHelp() {
  const rows = MATERIAL_KEYS.map(k => { const M = MATERIALS[k]; return `<tr><td><b>${M.name}</b></td><td>$${M.cost}/m</td><td>${M.strength / 1000} kN${M.tensionOnly ? ' (pull only)' : ''}</td><td>${M.density} kg/m</td><td>${M.maxLen} m</td></tr>`; }).join('');
  card.className = 'card'; card.style.maxWidth = '520px';
  card.innerHTML = `<h2>How to play</h2>
    <div class="help">
    • <b>Drag</b> from a red anchor or any joint to place a member. Joints snap to a 1 m grid.<br>
    • Vehicles only drive on <b>Road</b>. Connect road from bank to bank, then hold it up.<br>
    • <b>Triangles</b> are rigid; squares fold. A plain arch of hinged links folds too: brace it.<br>
    • Long members <b>buckle</b> when squeezed, so compression members should be short. Pulling is fine.<br>
    • <b>Cable</b> only pulls but is the strongest member per dollar. <b>Steel</b> is strong and heavy, <b>wood</b> cheap and light.<br>
    • Members can't pass through rock, piers, towers or a shipping lane.<br>
    • <b>TEST</b> shows stress live: green is relaxed, red is about to snap. Hover or tap a member for exact forces.<br>
    • <b>Mirror</b> copies what you build across the centre line.<br>
    • Zoom with the mouse wheel, pinch or the + / − buttons. Pan with a right-drag, Shift-drag, a two-finger drag, or a drag that starts on solid ground.<br>
    • Keys: 1–4 materials · E erase · M mirror · S stress · F fit · Ctrl+Z / Ctrl+Y undo / redo · Space test.
    <table style="width:100%;font-size:12px;margin-top:8px;border-collapse:collapse;color:#c9d6ea">
      <tr style="color:#8fa3bf"><td>Material</td><td>Cost</td><td>Strength</td><td>Weight</td><td>Max</td></tr>${rows}</table>
    </div>
    <div class="row"><button id="hCred" class="ghost">Photo credits</button><button id="hClose" class="active">Let's build</button></div>`;
  openOverlay();
  $('hClose').onclick = () => { card.style.maxWidth = ''; overlay.hidden = true; if (!load('seen-brief-' + level.id)) { store('seen-brief-' + level.id, 1); showBriefing(); } };
  $('hCred').onclick = () => { card.style.maxWidth = ''; showCredits(); };
}
function showCredits() {
  const li = p => `<li><a href="${esc(photoPage(p))}" target="_blank" rel="noopener">${esc(p.title)}</a>${p.credit ? ' · ' + esc(p.credit) : ''}</li>`;
  card.className = 'card'; card.style.maxWidth = '520px';
  card.innerHTML = `<h2>Photo credits</h2>
    <div class="credits"><p>Real-world photos are loaded from <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> when you are online.
    Each link opens the file page with its author and licence.</p>
    <b>Bridges</b><ul>${Object.values(PHOTOS).map(li).join('')}</ul>
    <b>Vehicles</b><ul>${Object.values(VEHICLE_PHOTOS).map(li).join('')}</ul></div>
    <div class="row"><button id="cBack" class="active">Back</button></div>`;
  openOverlay();
  $('cBack').onclick = () => { card.style.maxWidth = ''; showLevels(); };
}

// ---------- drawing the frame ----------
function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ensureBackground();
  ctx.drawImage(bgCv, 0, 0, W, H);
  let shx = 0, shy = 0;
  if (shake > 0) { shx = (Math.random() - 0.5) * shake * 7; shy = (Math.random() - 0.5) * shake * 7; shake = Math.max(0, shake - dt * 2.5); }
  drawWater(clock);
  drawReflection();
  drawWaterSurface(clock);
  drawShipLanes(clock);
  ctx.save(); ctx.translate(shx, shy);
  if (mode === 'build') renderBuild();
  else if (sim) renderSim();
  ctx.restore();
  drawWaterFront();
  drawRain(dt); drawLightning(dt);
  if (mode === 'sim' && sim) drawTooltip();
  updateHud();
}
function designNodesFn() { const byId = new Map(design.nodes.map(n => [n.id, n])); return id => byId.get(id); }
function drawDesignMembers() {
  const get = designNodesFn();
  const sorted = design.beams.slice().sort((a, b) => MAT_ORDER[a.mat] - MAT_ORDER[b.mat]);
  for (const b of sorted) { const A = get(b.a), B = get(b.b); drawMember(A.x, A.y, B.x, B.y, b.mat); }
}
function drawReflection() {
  const yw = sy(level.water), yb = sy(level.floor);
  if (yw >= yb) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(sx(0), yw, sx(level.gap) - sx(0), yb - yw); ctx.clip();
  ctx.translate(0, 2 * yw); ctx.scale(1, -1);
  ctx.globalAlpha = 0.2;
  if (mode === 'build') drawDesignMembers();
  else if (sim) { drawStructure(sim.nodes, sim.beams, true, true); for (const v of sim.vehicles) drawSimVehicle(v); }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function ghostVehicles() {
  let frontX = -0.8;
  for (const k of vehiclesFor(level)) {
    const V = VEHICLES[k], x = frontX - vehicleFront(V);
    drawVehicle(V, x, level.leftY, 0, 0, 0.55);
    frontX = x - V.rear - level.convoyGap;
  }
}
function renderBuild() {
  drawGrid();
  if (mirror) drawMirrorLine();
  ghostVehicles();
  drawDesignMembers();
  for (const n of design.nodes) drawJoint(n.x, n.y, n.anchor);
  if (drag && drag.start && drag.end) {
    const ok = beamValid(drag.start, drag.end);
    ctx.globalAlpha = 0.8;
    drawMember(drag.start.x, drag.start.y, drag.end.x, drag.end.y, tool, ok ? null : '#ff3b3b');
    if (mirror && ok) {
      const ma = mirrorPt(drag.start), mb = mirrorPt(drag.end);
      if (ma && mb && beamValid(ma, mb)) { ctx.globalAlpha = 0.4; drawMember(ma.x, ma.y, mb.x, mb.y, tool); }
    }
    ctx.globalAlpha = 1;
    const L = beamLength(drag.start, drag.end), M = MATERIALS[tool];
    const lbl = L.toFixed(1) + ' m · $' + Math.round(L * M.cost) + (M.tensionOnly ? '' : ' · holds ' + Math.round(compStrength(tool, L) / 1000) + ' kN squeezed');
    label(lbl, sx(drag.end.x), sy(drag.end.y) - 16);
    drawJoint(drag.end.x, drag.end.y, false);
  } else if (hoverW && tool !== 'erase' && !pan && !pinch) {
    const p = pickStart(hoverW);
    if (p) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), Math.max(6, view.s * 0.28), 0, Math.PI * 2); ctx.stroke(); }
  } else if (hoverW && tool === 'erase') {
    const i = beamNear(hoverW, nodeById, design.beams);
    if (i >= 0) { const b = design.beams[i], A = nodeById(b.a), B = nodeById(b.b); ctx.globalAlpha = 0.7; drawMember(A.x, A.y, B.x, B.y, b.mat, '#ff3b3b'); ctx.globalAlpha = 1; }
  }
}
function renderSim() {
  drawStructure(sim.nodes, sim.beams, true);
  for (const n of sim.nodes) { if (n.stubEnd || (n.m === 0 && !n.fixed)) continue; drawJoint(n.x, n.y, n.fixed); }
  for (const v of sim.vehicles) drawSimVehicle(v);
  drawParticles();
}
function drawTooltip() {
  if (!hoverW) return;
  const i = beamNear(hoverW, id => sim.nodes[id], sim.beams, b => b.broken || b.stub);
  if (i < 0) return;
  const b = sim.beams[i], A = sim.nodes[b.a], B = sim.nodes[b.b];
  const kN = Math.abs(b.force / 1000).toFixed(1);
  const txt = `${MATERIALS[b.mat].name} · ${Math.round(b.ratio * 100)}% · ${b.force >= 0 ? 'pulled' : 'squeezed'} ${kN} kN`;
  ctx.globalAlpha = 0.9; drawMember(A.x, A.y, B.x, B.y, b.mat, '#ffffff'); ctx.globalAlpha = 1;
  drawMember(A.x, A.y, B.x, B.y, b.mat, stressColor(b.ratio));
  label(txt, Math.min(W - 120, Math.max(120, sx(hoverW.x))), sy(hoverW.y) - 18);
}
let hudText = '';
function updateHud() {
  let t;
  if (mode === 'build') t = `${vehicleSummary(level)} · drag to build · ${view.s > view.fit * 1.05 ? 'zoomed ' + (view.s / view.fit).toFixed(1) + '×' : 'scroll / pinch to zoom'}`;
  else if (sim) {
    t = `t = ${sim.time.toFixed(1)} s · peak stress ${Math.round(sim.maxRatio * 100)}% · broken ${sim.brokenCount}`;
    if (level.wind) t += ` · gusts ${Math.round(30 + 60 * windLevel(sim.time))} km/h`;
    if (simSpeed !== 1) t += ` · ${simSpeed}× speed`;
  }
  if (t !== hudText) { hud.textContent = t; hudText = t; }
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
  if (mode === 'sim' && sim) {
    acc += dt * simSpeed;
    let steps = 0;
    const maxSteps = Math.ceil(4 * simSpeed);
    while (acc >= 1 / 60 && steps < maxSteps) {
      stepSim(sim, 1 / 60, 40);
      acc -= 1 / 60; steps++;
      handleEvents();
      stepParticles(1 / 60);
      if (sim.result && sim.result.ok) for (const v of sim.vehicles) if (v.state === 'done') { v.x += v.v / 60; v.rot += v.v / 60 / v.V.wheelR; }
    }
    if (acc > 0.25) acc = 0;
    if (!sim.result) {
      const moving = sim.vehicles.filter(v => v.state === 'drive');
      Sound.setEngine(moving.length ? 1 : 0, moving.reduce((m, v) => Math.max(m, v.v), 0));
      if (level.wind) Sound.setWind(windLevel(sim.time));
    }
    if (sim.result && !resultShownAt) { resultShownAt = now; Sound.stopLoops(); if (sim.result.ok) Sound.win(); else setTimeout(() => Sound.lose(), 400); }
    if (resultShownAt && !resultDismissed && overlay.hidden && now - resultShownAt > 1100) showResult(sim.result);
  }
  render(dt);
  requestAnimationFrame(frame);
}

// ---------- start ----------
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => { if (e.code === 'ShiftLeft') panKeyHeld = true; });
window.addEventListener('keyup', e => { if (e.code === 'ShiftLeft') panKeyHeld = false; });
setTool('road');
resize();
const savedId = load('level');
const startIdx = Math.max(0, LEVELS.findIndex(l => l.id === savedId));
loadLevel(startIdx, false);
if (!load('seen-help')) { store('seen-help', 1); showHelp(); }
else { store('seen-brief-' + level.id, 1); showBriefing(); }
updateButtons();
requestAnimationFrame(frame);
</script>
